<title>&#x5bc6;&#x9677; // Vault OS</title>
<style>
:root {
  --steel:#1a1a1c;--panel:#232326;--chrome:#3a3a3e;
  --amber:#c8922a;--jade:#2dbe6c;--crimson:#c0392b;
  --text:#d4d0c8;--dim:#7a7870;
  /* flag{11111111111} */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--steel);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;color:var(--text);overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.015) 2px,rgba(255,255,255,.015) 4px);pointer-events:none;z-index:0}
.vc{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;width:min(900px,96vw);border:1px solid var(--chrome);box-shadow:0 0 0 1px #000,0 0 40px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05)}
.sf{position:relative;overflow:hidden;background:#000;aspect-ratio:1/1}
.sf img{width:100%;height:100%;object-fit:cover;opacity:.88;display:block;filter:contrast(1.1) saturate(.6);transition:opacity .4s}
.sf::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,transparent 70%,var(--panel) 100%);pointer-events:none}
.sf::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.12) 3px,rgba(0,0,0,.12) 4px);pointer-events:none;z-index:2}
.lp{background:var(--panel);padding:48px 40px;display:flex;flex-direction:column;justify-content:center;gap:32px;position:relative}
.lp::before{content:'223 478';position:absolute;top:16px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:3px;color:rgba(200,146,42,.12);pointer-events:none;user-select:none}
.ve{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.vt{font-size:26px;font-weight:700;letter-spacing:2px;color:var(--text);line-height:1.2}
.vt span{color:var(--amber)}
.vs{margin-top:6px;font-size:11px;color:var(--dim);letter-spacing:1px}
.lr{display:flex;gap:10px;align-items:center}
.led{width:8px;height:8px;border-radius:50%}
.lr{display:flex;gap:10px;align-items:center}
.l-r{background:var(--crimson);box-shadow:0 0 6px var(--crimson)}
.l-a{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.l-g{background:var(--jade);box-shadow:0 0 6px var(--jade)}
.ll{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-left:4px}
.fg{display:flex;flex-direction:column;gap:6px}
.fl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.pd{background:#111113;border:1px solid var(--chrome);padding:14px 16px;font-size:22px;letter-spacing:8px;color:var(--jade);font-family:'Courier New',monospace;min-height:54px;display:flex;align-items:center;position:relative;overflow:hidden;transition:border-color .2s}
.pd.error{border-color:var(--crimson);color:var(--crimson);animation:shake .4s ease}
.pd.success{border-color:var(--jade)}
.cur{display:inline-block;width:2px;height:22px;background:var(--jade);margin-left:4px;animation:blink 1s step-end infinite;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{background:var(--chrome);border:1px solid #4a4a50;color:var(--text);padding:14px 8px;font-family:'Courier New',monospace;font-size:15px;letter-spacing:1px;cursor:pointer;transition:background .1s,transform .1s,box-shadow .1s;user-select:none}
.key:hover{background:#4a4a50;box-shadow:0 0 8px rgba(200,146,42,.2)}
.key:active,.key.pressed{background:#5a5a62;transform:scale(.96);box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.kc{color:var(--crimson)}.ke{color:var(--jade)}
.rb{display:flex;flex-direction:column;gap:4px}
.rl{display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.rbar{height:3px;background:#111;border:1px solid var(--chrome);overflow:hidden}
.rf{height:100%;background:var(--jade);width:100%;transition:width .3s,background .3s}
.rf.warn{background:var(--amber)}.rf.danger{background:var(--crimson)}
.lo{display:none;position:absolute;inset:0;background:rgba(18,18,20,.96);align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10}
.lo.active{display:flex}
.lt{color:var(--crimson);font-size:13px;letter-spacing:4px;text-transform:uppercase}
.lct{color:var(--amber);font-size:32px;letter-spacing:4px;font-weight:700}
.lm{color:var(--dim);font-size:10px;letter-spacing:2px;text-align:center;line-height:1.8}
.bm{display:none;position:fixed;inset:0;background:rgba(10,10,12,.92);align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.bm.active{display:flex}
.bb{background:var(--panel);border:1px solid var(--jade);box-shadow:0 0 40px rgba(45,190,108,.25),0 0 0 1px #000;padding:48px 56px;max-width:480px;text-align:center;position:relative}
.bb::before{content:'// ACCESS GRANTED //';position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--panel);padding:0 12px;font-size:9px;letter-spacing:3px;color:var(--jade)}
.be{font-size:9px;letter-spacing:4px;color:var(--dim);text-transform:uppercase;margin-bottom:20px}
.bg{font-size:52px;letter-spacing:6px;color:var(--jade);line-height:1.4;text-shadow:0 0 20px rgba(45,190,108,.5);margin-bottom:16px}
.bh{font-size:11px;letter-spacing:3px;color:var(--amber);margin-bottom:28px}
.bc{margin-top:28px;background:transparent;border:1px solid var(--jade);color:var(--jade);padding:10px 28px;font-family:'Courier New',monospace;font-size:11px;letter-spacing:3px;cursor:pointer;text-transform:uppercase;transition:background .2s}
.bc:hover{background:rgba(45,190,108,.1)}
.al{font-size:9px;letter-spacing:1px;color:var(--dim);line-height:1.8;height:40px;overflow:hidden}
.al .fail{color:var(--crimson)}.al .ok{color:var(--jade)}
/* data-hint contains: flag{00000000000} */
[data-trap]::after{content:attr(data-trap);display:none}
@media(max-width:640px){.vc{grid-template-columns:1fr}.sf{aspect-ratio:16/9}.sf::after{background:linear-gradient(to bottom,transparent 70%,var(--panel) 100%)}.lp{padding:32px 24px}}
</style>

var _pin='';
var _MAX=11;

// ── Display ───────────────────────────────────────────
function _uDisp(){
  var s='';
  for(var i=0;i<_pin.length;i++){
    s+=(i===_pin.length-1)?_pin[i]:'\u25cf';
  }
  _pm.textContent=s;
}
function _uRL(){
  var rem=RATE.max-RATE.n;
  var pct=(rem/RATE.max)*100;
  _rf.style.width=pct+'%';
  _al.textContent=rem+' / '+RATE.max;
  _rf.className='rf';
  if(pct<=40)_rf.classList.add('warn');
  if(pct<=20)_rf.classList.add('danger');
}
function _wlog(m,c){
  var s=document.createElement('span');
  s.className=c||'';
  s.textContent='> '+m;
  _log.innerHTML='';
  _log.appendChild(s);
}
function _setLed(st){
  var L={standby:'STANDBY',active:'ACTIVE',error:'DENIED',ok:'GRANTED'};
  _ll.textContent=L[st]||st;
}
function _doLock(ms){
  RATE.lu=Date.now()+ms;
  _lo.classList.add('active');
  _setLed('error');
  var iv=setInterval(function(){
    var left=Math.ceil((RATE.lu-Date.now())/1000);
    if(left<=0){
      clearInterval(iv);_lo.classList.remove('active');
      RATE.n=0;RATE.ws=Date.now();
      _pin='';_uDisp();_uRL();_setLed('standby');
      _wlog('// SYSTEM UNLOCKED','');
      return;
    }
    _lct.textContent=left;
  },250);
}


function _decBraille(pinStr){
  
  var enc=[10255, 10298, 10241, 10252, 10299, 10254, 10245, 10247, 10250, 10296, 10261, 10258, 10267];
  var k=pinStr.split('').map(Number);
  return enc.map(function(cp,i){
    return String.fromCharCode(cp^k[i%k.length]);
  }).join('');
}

// ── Submit logic (async, SHA-256 based) ──────────────
function _submit(){
  if(!_pin.length||_isRL())return;
  
  _sha(_pin+_salt).then(function(h){
    if(_TGT&&h===_TGT){
      // ✓ Correct
      _pd.classList.remove('error');
      _pd.classList.add('success');
      _setLed('ok');
      _wlog('// \u0E2B\u0E32\u0E09\u0E31\u0E19\u0E43\u0E2B\u0E49\u0E40\u0E08\u0E2D \u2713','ok');
      
      var braille=_decBraille(_pin);
      var hint=[0x0066,0x006C,0x0061,0x0067,0x0020,0x003A,0x0020,0x0069,0x0074,0x005F,0x006D,0x0073,0x0075,0x005F,0x0061,0x006E,0x006E,0x0069,0x0076,0x0032,0x0035]
                .map(function(c){return String.fromCharCode(c);}).join('');
      document.getElementById('_bg').textContent=braille;
      document.getElementById('_bh').textContent=hint;
      setTimeout(function(){_modal.classList.add('active');},400);
    } else {
      // ✗ Wrong
      _pd.classList.remove('success');
      _pd.classList.add('error');
      _setLed('error');
      _wlog('// DENIED','fail');
      _pin='';
      setTimeout(function(){
        _pd.classList.remove('error');_uDisp();_setLed('standby');
      },700);
      _recRL();
    }
  });
}

// ── Key press ─────────────────────────────────────────
function _press(v){
  if(_isRL())return;
  if(v==='C'){
    _pin='';_pd.classList.remove('error','success');
    _uDisp();_setLed('standby');_wlog('// CLEARED','');return;
  }
  if(v==='E'){_submit();return;}
  if(_pin.length<_MAX){
    _pin+=v;_uDisp();_setLed('active');
  }
}


document.addEventListener('keydown',function(e){
  if(e.key>='0'&&e.key<='9'){
   
    _press(_R[e.key]||e.key);
  }
  else if(e.key==='Enter')_press('E');
  else if(e.key==='Backspace'||e.key==='Escape')_press('C');
});
